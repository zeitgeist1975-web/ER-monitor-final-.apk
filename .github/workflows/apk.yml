          import os, re
          src = os.environ['APP_SRC']
          s = open('main.py', encoding='utf-8').read()
          s = re.sub(r"^APP_SRC = .*$", "APP_SRC = %r" % src, s, count=1, flags=re.M)
          open('main.py', 'w', encoding='utf-8').write(s)
          print('APP_SRC ->', src)
          PYFIX

          # ── 아이콘 / 프리스플래시 (저장소에 없으면 자동 생성) ──
