            python3 - <<'__EMB_MKICONS_PY__' || true
          #!/usr/bin/env python3
          # icon.png (512) / presplash.png (1024)
          # 구성: 상황판(패널) + 심전도 + 병상 행(침상 글리프 + 가용 바) + 앰뷸런스
          # 색상: 저채도 다색 (틸 / 앰버 / 로즈 / 인디고 / 스틸) — 순수 원색 없음
          import math
          import os

          from PIL import Image, ImageDraw, ImageFilter, ImageFont

          BG_TOP = (14, 19, 27)        # #0E131B
          BG_BOT = (30, 41, 56)        # #1E2938
          PANEL = (25, 34, 46)
          PANEL_LN = (63, 79, 100)
          HEADER = (92, 104, 148)      # 뮤트 인디고
          BODY = (231, 237, 244)
          BODY_D = (166, 179, 195)
          GLASS = (124, 138, 170)      # 뮤트 바이올렛블루
          CROSS = (185, 124, 122)      # 뮤트 로즈
          BEACON = (206, 176, 120)     # 뮤트 앰버
          MINT = (127, 178, 166)       # 뮤트 민트 (가용)
          AMBER = (200, 170, 118)      # 뮤트 앰버 (주의)
          ROSE = (185, 124, 122)       # 뮤트 로즈 (포화)
          STEEL = (150, 166, 186)      # 침상
          TRACK = (47, 60, 76)
          TIRE = (21, 28, 38)
          FOG = (146, 160, 178)
          TEXT = (233, 239, 246)
          SUP = 4


          def font(px, bold=True):
              for p in ('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold
                        else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                        '/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf'):
                  if os.path.exists(p):
                      try:
                          return ImageFont.truetype(p, px)
                      except Exception:
                          pass
              return ImageFont.load_default()


          def vgrad(img, c0, c1):
              d = ImageDraw.Draw(img)
              for y in range(img.height):
                  t = y / max(1, img.height - 1)
                  d.line([(0, y), (img.width, y)],
                         fill=tuple(int(a + (b - a) * t) for a, b in zip(c0, c1)))


          def glow(img, cx, cy, r, color, a=32):
              g = Image.new('RGBA', img.size, (0, 0, 0, 0))
              ImageDraw.Draw(g).ellipse([cx - r, cy - r, cx + r, cy + r], fill=color + (a,))
              img.alpha_composite(g.filter(ImageFilter.GaussianBlur(r * 0.45)))


          def _layer(img):
              S = img.size[0] * SUP
              lay = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              return lay, ImageDraw.Draw(lay)


          def ambulance(img, x, y, w):
              lay, d = _layer(img)
              X, Y, W = x * SUP, y * SUP, w * SUP
              H = W * 0.46
              r = W * 0.075
              d.rounded_rectangle([X + W * 0.30, Y, X + W, Y + H], radius=r, fill=BODY + (255,))
              d.polygon([(X, Y + H), (X, Y + H * 0.50), (X + W * 0.145, Y + H * 0.16),
                         (X + W * 0.345, Y + H * 0.16), (X + W * 0.345, Y + H)],
                        fill=BODY + (255,))
              d.polygon([(X + W * 0.055, Y + H * 0.49), (X + W * 0.170, Y + H * 0.245),
                         (X + W * 0.300, Y + H * 0.245), (X + W * 0.300, Y + H * 0.49)],
                        fill=GLASS + (255,))
              d.rounded_rectangle([X + W * 0.50, Y - H * 0.145, X + W * 0.665, Y],
                                  radius=r * 0.7, fill=BEACON + (255,))
              cx, cy = X + W * 0.735, Y + H * 0.46
              arm, th = W * 0.082, W * 0.033
              d.rounded_rectangle([cx - th / 2, cy - arm, cx + th / 2, cy + arm],
                                  radius=th * 0.28, fill=CROSS + (255,))
              d.rounded_rectangle([cx - arm, cy - th / 2, cx + arm, cy + th / 2],
                                  radius=th * 0.28, fill=CROSS + (255,))
              for ratio in (0.245, 0.790):
                  wx, rr = X + W * ratio, W * 0.098
                  d.ellipse([wx - rr, Y + H - rr * 0.70, wx + rr, Y + H + rr * 1.30],
                            fill=TIRE + (255,))
                  d.ellipse([wx - rr * 0.38, Y + H + rr * 0.30 - rr * 0.38,
                             wx + rr * 0.38, Y + H + rr * 0.30 + rr * 0.38],
                            fill=BODY_D + (255,))
              img.alpha_composite(lay.resize(img.size, Image.LANCZOS))


          def board(img, x, y, w, h):
              """상황판 — 인디고 헤더 스트립 + 본체."""
              lay, d = _layer(img)
              X, Y, W, H = x * SUP, y * SUP, w * SUP, h * SUP
              r = min(W, H) * 0.10
              d.rounded_rectangle([X, Y, X + W, Y + H], radius=r, fill=PANEL + (255,))
              d.rounded_rectangle([X, Y, X + W, Y + H * 0.135], radius=r * 0.6,
                                  fill=HEADER + (255,))
              d.rectangle([X, Y + H * 0.075, X + W, Y + H * 0.135], fill=HEADER + (255,))
              d.rounded_rectangle([X, Y, X + W, Y + H], radius=r,
                                  outline=PANEL_LN + (255,), width=max(2, int(W * 0.009)))
              img.alpha_composite(lay.resize(img.size, Image.LANCZOS))


          def bed_glyph(img, x, y, w, tint):
              """소형 침상 글리프 — 헤드보드 + 매트리스 + 베개."""
              lay, d = _layer(img)
              X, Y, W = x * SUP, y * SUP, w * SUP
              t = W * 0.30
              d.rounded_rectangle([X, Y - W * 0.17, X + W * 0.10, Y + t],
                                  radius=t * 0.30, fill=STEEL + (255,))
              d.rounded_rectangle([X + W * 0.06, Y, X + W, Y + t],
                                  radius=t * 0.35, fill=STEEL + (255,))
              d.rounded_rectangle([X + W * 0.15, Y - t * 0.52, X + W * 0.44, Y + t * 0.10],
                                  radius=t * 0.35, fill=tint + (255,))
              img.alpha_composite(lay.resize(img.size, Image.LANCZOS))


          def ecg(img, x0, x1, y, amp, width, color, cycles=1.3):
              lay, d = _layer(img)
              X0, X1, Y, A, W = x0 * SUP, x1 * SUP, y * SUP, amp * SUP, width * SUP
              pts, step = [], max(1, int((X1 - X0) / 420))
              for px in range(int(X0), int(X1) + 1, step):
                  t = (px - X0) / max(1, X1 - X0)
                  u = (t * cycles) % 1.0
                  if   u < 0.34: v = 0.0
                  elif u < 0.38: v = -0.16
                  elif u < 0.43: v = 1.0
                  elif u < 0.47: v = -0.42
                  elif u < 0.51: v = 0.08
                  elif u < 0.64: v = 0.0
                  elif u < 0.74: v = 0.20 * math.sin((u - 0.64) / 0.10 * math.pi)
                  else:          v = 0.0
                  pts.append((px, Y - v * A))
              d.line(pts, fill=color + (255,), width=int(W), joint='curve')
              img.alpha_composite(lay.resize(img.size, Image.LANCZOS))


          def bar(img, x, y, w, h, ratio, color):
              lay, d = _layer(img)
              X, Y, W, H = x * SUP, y * SUP, w * SUP, h * SUP
              d.rounded_rectangle([X, Y, X + W, Y + H], radius=H / 2, fill=TRACK + (255,))
              d.rounded_rectangle([X, Y, X + W * max(0.06, ratio), Y + H], radius=H / 2,
                                  fill=color + (255,))
              img.alpha_composite(lay.resize(img.size, Image.LANCZOS))


          def compose(img, S, bx, by, bw, bh, aw, ay, rows=3):
              board(img, bx, by, bw, bh)
              ecg(img, bx + bw * 0.085, bx + bw * 0.915, by + bh * 0.335,
                  bh * 0.145, max(3, S * 0.012), MINT, 1.3)
              data = [(0.78, MINT), (0.46, AMBER), (0.20, ROSE)][:rows]
              gx = bx + bw * 0.085
              gw = bw * 0.190                     # 침상 글리프 폭
              bar_x = gx + gw + bw * 0.050
              bar_w = bx + bw * 0.915 - bar_x
              top = by + bh * 0.520
              step = bh * 0.163
              for i, (ratio, col) in enumerate(data):
                  cy = top + i * step
                  bed_glyph(img, gx, cy, gw, col)
                  bar(img, bar_x, cy + gw * 0.055, bar_w, bh * 0.078, ratio, col)
              ambulance(img, (S - aw) / 2, ay, aw)


          def make_icon(path, S=512):
              base = Image.new('RGB', (S, S), BG_TOP)
              vgrad(base, BG_TOP, BG_BOT)
              img = base.convert('RGBA')
              glow(img, int(S * 0.50), int(S * 0.56), int(S * 0.34), MINT, 26)
              compose(img, S, S * 0.095, S * 0.420, S * 0.810, S * 0.470,
                      S * 0.545, S * 0.090, rows=3)
              img.convert('RGB').save(path, 'PNG')
              return path


          def make_presplash(path, S=1024):
              base = Image.new('RGB', (S, S), BG_TOP)
              vgrad(base, BG_TOP, BG_BOT)
              img = base.convert('RGBA')
              glow(img, int(S * 0.50), int(S * 0.42), int(S * 0.29), MINT, 24)
              compose(img, S, S * 0.255, S * 0.330, S * 0.490, S * 0.285,
                      S * 0.330, S * 0.155, rows=3)

              d = ImageDraw.Draw(img)
              f1, f2 = font(int(S * 0.060)), font(int(S * 0.022), bold=False)
              t1 = 'E R   M O N I T O R'
              bb = d.textbbox((0, 0), t1, font=f1)
              d.text(((S - bb[2] + bb[0]) / 2, int(S * 0.690)), t1, font=f1, fill=TEXT + (255,))
              d.line([(S * 0.362, S * 0.782), (S * 0.638, S * 0.782)],
                     fill=MINT + (170,), width=max(2, int(S * 0.003)))
              t2 = 'REAL-TIME  BED  AVAILABILITY'
              bb = d.textbbox((0, 0), t2, font=f2)
              d.text(((S - bb[2] + bb[0]) / 2, int(S * 0.806)), t2, font=f2, fill=FOG + (255,))

              bx, bw, by, bh = S * 0.362, S * 0.276, S * 0.884, S * 0.007
              d.rounded_rectangle([bx, by, bx + bw, by + bh], radius=bh / 2, fill=TRACK + (255,))
              d.rounded_rectangle([bx, by, bx + bw * 0.42, by + bh], radius=bh / 2,
                                  fill=MINT + (255,))
              img.convert('RGB').save(path, 'PNG')
              return path

          make_icon('icon.png')
          make_presplash('presplash.png')
          print('[gen] icon.png / presplash.png 생성')
          __EMB_MKICONS_PY__
          else
            echo "[gen] icon.png / presplash.png 기존 파일 사용"
          fi
          if [ -f icon.png ] && [ -f presplash.png ]; then
            echo "[gen] 아이콘 준비 완료 (icon=$(wc -c < icon.png) presplash=$(wc -c < presplash.png) bytes)"
          else
            echo "::warning::아이콘 생성 실패 — buildozer.spec 에서 해당 항목 제거 후 계속"
            sed -i '/^icon\.filename/d;/^presplash\.filename/d;/^android\.presplash_color/d' buildozer.spec
          fi

          echo "[gen] --- 생성 결과 ---"
          for f in main.py buildozer.spec .gitattributes .gitignore \
                   src/android/extra_manifest.xml \
                   src/android/extra_manifest_application_arguments.xml \
                   tools/patch_p4a_manifest.sh; do
            if [ -f "$f" ]; then echo "  OK   $f ($(wc -c < "$f") bytes)";
            else echo "::error::생성 실패 $f"; exit 1; fi
          done
          python3 -m py_compile main.py
          bash -n tools/patch_p4a_manifest.sh
          echo "[gen] 검증 통과"

      - name: 생성 파일을 저장소에 커밋
        if: env.COMMIT_GEN == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A main.py buildozer.spec .gitattributes .gitignore README_BUILD.md \
                    icon.png presplash.png src/android tools 2>/dev/null || true
          git update-index --chmod=+x tools/patch_p4a_manifest.sh 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 빌드 파일 자동 생성 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::push 실패(무시하고 빌드 계속)"
          fi

      # ── 2. 툴체인 ──────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 파이썬 문법 사전 검증
        run: |
          python -m py_compile main.py "$APP_SRC"
          echo "syntax OK"

      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool \
            libtool-bin pkg-config zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev build-essential ccache \
            patch wget curl lld
          sudo apt-get install -y libtinfo5 2>/dev/null || true
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
                        /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi

      - name: buildozer 설치
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36" virtualenv \
                                "sh<2.0" colorama appdirs packaging jinja2 build toml
          buildozer --version

      # ── 3. p4a 클론 + PiP 매니페스트 패치 ──────────────────────
      - name: python-for-android 준비 및 PiP 패치
        run: |
          set -e
          rm -rf p4a
          git clone --depth 1 --branch "$P4A_REF" \
            https://github.com/kivy/python-for-android.git p4a
          echo "p4a HEAD: $(git -C p4a rev-parse --short HEAD)"
          bash tools/patch_p4a_manifest.sh "$GITHUB_WORKSPACE/p4a"
          python3 - <<'PYP'
          import os, re
          p = 'buildozer.spec'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'^p4a\.source_dir\s*=.*$',
                     'p4a.source_dir = %s' % os.path.join(os.environ['GITHUB_WORKSPACE'], 'p4a'),
                     s, count=1, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PYP
          grep -n 'p4a.source_dir' buildozer.spec

      # ── 4. 캐시 ────────────────────────────────────────────────
      - name: 빌드 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.ccache
            .buildozer
          key: bz-${{ runner.os }}-${{ env.P4A_REF }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bz-${{ runner.os }}-${{ env.P4A_REF }}-

      - name: 캐시 정합성 검사 (p4a 버전 변경 시 폐기)
        run: |
          MARK=.buildozer/.p4a_ref
          if [ -f "$MARK" ] && [ "$(cat "$MARK")" != "$P4A_REF" ]; then
            echo "p4a 변경: $(cat "$MARK") -> $P4A_REF — 기존 빌드 산출물 폐기"
            rm -rf .buildozer/android/platform/build-* \
                   .buildozer/android/platform/python-for-android
          fi
          mkdir -p .buildozer && echo "$P4A_REF" > "$MARK"

          # requirements 가 바뀌면 pip 설치 결과(python-installs)를 반드시 폐기한다.
          # restore-keys 로 이전 캐시가 복원되면 새 핀(예: werkzeug==2.2.3)이 무시된다.
          RMARK=.buildozer/.req_hash
          REQ_H=$(grep -m1 "^requirements" buildozer.spec | md5sum | cut -c1-16)
          if [ ! -f "$RMARK" ] || [ "$(cat "$RMARK")" != "$REQ_H" ]; then
            echo "requirements 변경/미기록 — python-installs, dists 폐기"
            rm -rf .buildozer/android/platform/build-*/build/python-installs \
                   .buildozer/android/platform/build-*/dists
          else
            echo "requirements 동일 — 캐시 유지 ($REQ_H)"
          fi
          echo "$REQ_H" > "$RMARK"
          echo "현재 p4a = $P4A_REF"

      # ── 5. 빌드 ────────────────────────────────────────────────
      - name: APK 빌드
        run: |
          set -o pipefail
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export GRADLE_OPTS="-Xmx4g -Dorg.gradle.daemon=false"
          buildozer -v android debug 2>&1 | tee build.log

      - name: 산출물/매니페스트 검증
        run: |
          ls -alh bin/ || true
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          test -n "$APK" || { echo "::error::APK 미생성"; exit 1; }
          echo "APK=$APK ($(wc -c < "$APK") bytes)"
          M=$(find .buildozer -path '*dists*' -name 'AndroidManifest.xml' 2>/dev/null | head -1 || true)
          if [ -n "$M" ]; then
            echo "--- $M ---"
            grep -o 'supportsPictureInPicture="[^"]*"' "$M" \
              || echo "::warning::PiP 속성 미검출 — patch_manifest.log 확인"
            grep -o 'android.permission.[A-Z_]*' "$M" | sort -u
          fi
          {
            echo "### 빌드 성공"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| APK | \`$(basename "$APK")\` |"
            echo "| 크기 | $(du -h "$APK" | cut -f1) |"
            echo "| 원본 | \`$APP_SRC\` |"
            echo "| p4a | $P4A_REF |"
            echo ""
            echo "아래 **Artifacts → ermonitor-apk** 에서 내려받으십시오."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6. 결과물 / 로그 업로드 ────────────────────────────────
      - name: 의존성 정합성 검사
        if: always()
        run: |
          set +e
          echo "── 번들된 패키지 확인 ──"
          for d in $(find .buildozer -type d -name site-packages 2>/dev/null) \
                   $(find .buildozer -type d -path '*python-installs/*' -maxdepth 8 2>/dev/null | head -4); do
            [ -d "$d/werkzeug" ] || continue
            V=$(grep -ho "__version__ = \"[^\"]*\"" "$d/werkzeug/__init__.py" 2>/dev/null | head -1)
            echo "werkzeug @ $d  $V"
            if grep -q "def url_quote" "$d/werkzeug/urls.py" 2>/dev/null; then
              echo "  url_quote: 있음 (flask 2.0.3 호환)"
            else
              echo "::error::werkzeug 에 url_quote 없음 — flask 2.0.3 과 비호환. 캐시 폐기 필요"
            fi
          done
          grep -m1 "^requirements" buildozer.spec

      - name: APK 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ermonitor-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            patch_manifest.log
            .buildozer/android/platform/build-*/build/other_builds/**/*.log
            .buildozer/android/platform/build-*/dists/*/AndroidManifest.xml
            .buildozer/android/platform/build-*/dists/*/build/outputs/logs/*
          if-no-files-found: warn
          retention-days: 14

      - name: 실패 원인 요약
        if: failure()
        run: |
          {
            echo "### 빌드 실패"
            echo ""
            echo "\`\`\`"
            grep -nE "error:|ERROR|Traceback|FAILED|Exception|No such file" build.log \
              | tail -n 40 || echo "(build.log 없음 — 빌드 이전 단계에서 실패)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== 원인 자동 판별 ==="
          if grep -q "No matching distribution found" build.log 2>/dev/null; then
            BADPKG=$(grep -m1 "No matching distribution found for" build.log | sed 's/.*for //')
            echo "::error::[$BADPKG] 안드로이드용 배포판 없음. buildozer.spec requirements 에서 해당 패키지를 순수파이썬 버전으로 고정하거나 제거하십시오."
          fi
          if grep -q "BuildDependencyInstallError\|cannot import name .*pip._internal" build.log 2>/dev/null; then
            echo "::error::p4a 최신판의 hostpython/pip 비호환. Run workflow 에서 p4a_ref 를 v2024.01.21 로 지정하십시오."
          fi
          echo "=== build.log 마지막 200줄 ==="
          tail -n 200 build.log || true

      # ── 7. 태그 푸시 시 릴리스 ────────────────────────────────
      - name: 릴리스 생성
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
